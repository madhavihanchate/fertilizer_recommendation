{% extends 'recommender/base.html' %}
{% block content %}
<div class="card">
  <!-- ── One-Click Ticket Values Paste Section ────────────────── -->
  <div style="margin-bottom:1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;background:#f0faf3;border:1.5px solid #087F5B;border-radius:12px;padding:1.1rem 1.4rem;box-shadow:0 2px 10px rgba(8,127,91,0.08);">
    <div style="display:flex;align-items:center;gap:0.85rem;">
      <div style="width:42px;height:42px;border-radius:10px;background:#087F5B;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
      </div>
      <div>
        <strong style="color:#123C35;font-size:1.05rem;display:block;">Have a Scanned Soil Test Ticket?</strong>
        <span style="color:#556b64;font-size:0.85rem;">Transfer your SoiLENZ ticket readings from Seed2Serve in one click</span>
      </div>
    </div>
    <button type="button" id="pasteHomeTicketBtn" class="btn btn-primary" style="background:#087F5B;border:none;padding:0.7rem 1.4rem;font-weight:700;display:inline-flex;align-items:center;gap:0.5rem;cursor:pointer;border-radius:8px;font-size:0.95rem;box-shadow:0 2px 8px rgba(8,127,91,0.25);color:#fff;">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
      <span>📋 Paste Scanned Ticket Values</span>
    </button>
  </div>

  <h2>Do you have a Soil Test Report?</h2>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="{% url 'soil_test_choice' %}">
    {% csrf_token %}
    <div class="radio-group">
      <label><input type="radio" name="has_report" value="yes" required> Yes</label>
      <label><input type="radio" name="has_report" value="no" required> No</label>
    </div>
    <label for="state">State</label>
    <select name="state" id="state" required>
      <option value="">-- Select State --</option>
      {% for s in states %}
      <option value="{{ s }}">{{ s }}</option>
      {% endfor %}
    </select>
    <label for="crop">Crop</label>
    <input type="text" name="crop" id="crop" list="crop-list" placeholder="Type or select a crop" required>
    <datalist id="crop-list">
      {% for c in all_crops %}
      <option value="{{ c }}">
      {% endfor %}
    </datalist>
    <button type="submit" class="btn btn-primary">Continue</button>
  </form>
</div>
<script>
var stateCrops = {{ state_crops_json|safe }};
document.getElementById('state').addEventListener('change', function() {
  var state = this.value;
  var list = document.getElementById('crop-list');
  list.innerHTML = '';
  (stateCrops[state] || []).forEach(function(c) {
    var opt = document.createElement('option');
    opt.value = c;
    list.appendChild(opt);
  });
  document.getElementById('crop').value = '';
});

// Auto-fill from scanned SoiLENZ ticket in localStorage
(function() {
  try {
    var raw = localStorage.getItem('seed2serve_soil_ticket') || sessionStorage.getItem('seed2serve_soil_ticket');
    if (raw) {
      var data = JSON.parse(raw);
      var yesRadio = document.querySelector('input[name="has_report"][value="yes"]');
      if (yesRadio) yesRadio.checked = true;

      var stateSelect = document.getElementById('state');
      var stateToSelect = data.state_name || 'Karnataka';
      if (stateSelect) {
        for (var i = 0; i < stateSelect.options.length; i++) {
          if (stateSelect.options[i].value.toLowerCase() === stateToSelect.toLowerCase()) {
            stateSelect.selectedIndex = i;
            // populate crops
            var list = document.getElementById('crop-list');
            list.innerHTML = '';
            (stateCrops[stateSelect.options[i].value] || []).forEach(function(c) {
              var opt = document.createElement('option');
              opt.value = c;
              list.appendChild(opt);
            });
            break;
          }
        }
      }
      var cropInput = document.getElementById('crop');
      if (cropInput && data.crop) {
        cropInput.value = data.crop;
      }
    }
  } catch(e) {}

  var homePasteBtn = document.getElementById('pasteHomeTicketBtn');
  if (homePasteBtn) {
    homePasteBtn.addEventListener('click', function() {
      if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText().then(function(text) {
          handleHomePaste(text);
        }).catch(function() {
          var raw = prompt('Paste your copied SEED2SERVE_SOIL_DATA text here:');
          if (raw) handleHomePaste(raw);
        });
      } else {
        var raw = prompt('Paste your copied SEED2SERVE_SOIL_DATA text here:');
        if (raw) handleHomePaste(raw);
      }
    });
  }

  function handleHomePaste(text) {
    if (!text) return;
    var data = null;
    if (text.indexOf('SEED2SERVE_SOIL_DATA:') !== -1) {
      try {
        data = JSON.parse(text.substring(text.indexOf('SEED2SERVE_SOIL_DATA:') + 'SEED2SERVE_SOIL_DATA:'.length).trim());
      } catch(e) {}
    } else if (text.startsWith('{') && text.endsWith('}')) {
      try { data = JSON.parse(text); } catch(e) {}
    }
    if (data) {
      var qs = new URLSearchParams();
      qs.set('has_report', 'yes');
      qs.set('state', data.state_name || 'Karnataka');
      qs.set('crop', data.crop || 'Palm Orchids');
      ['ph', 'ec', 'oc', 'n', 'p', 'k', 'ca', 'mg', 's', 'fe', 'mn', 'cu', 'zn', 'b'].forEach(function(k) {
        if (data[k] !== undefined && data[k] !== null) qs.set(k, data[k]);
      });
      window.location.href = '/soil-test-choice/?' + qs.toString();
    } else {
      alert('Could not find valid soil ticket data in clipboard.');
    }
  }
})();
</script>
{% endblock %}
